name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Close kit self-check
        run: python3 tests/test_closekit.py
      - name: House style
        run: python3 scripts/closekit.py lint README.md CONTEXT.md CHANGELOG.md docs/*.md skills/*/README.md
      - name: Manifests match the skills on disk
        run: python3 scripts/check-manifests.py
